# Camunda 8.10 Orchestration Cluster (Zeebe + Operate + Tasklist) - local development settings.
# Based on the official lightweight Docker Compose distribution (application-h2.yaml).
# Not for production: the API is unprotected and the login is demo/demo.
camunda:
  backup:
    webapps:
      enabled: false
  system:
    cpu-thread-count: "3"
    io-thread-count: "3"
  security:
    authentication:
      method: "basic"
      # Lets the Spring Boot backend connect without credentials
      unprotectedApi: true
    authorizations:
      enabled: false
    initialization:
      users:
        - username: "demo"
          password: "demo"
          name: "Demo User"
          email: "demo@demo.com"
      defaultRoles.admin.users:
        - "demo"
  data:
    secondary-storage:
      type: rdbms
      rdbms:
        url: jdbc:h2:file:./camunda-data/h2db
        username: sa
        password:
        flushInterval: PT0.5S
        queueSize: 1000
