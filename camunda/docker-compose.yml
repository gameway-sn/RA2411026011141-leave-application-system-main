# Camunda 8.10 only - for development mode (Step 4 of the guide), where you run
# Spring Boot with Maven and React with Vite on your machine.
#
#   cd camunda
#   docker compose up -d
#
# Operate:  http://localhost:8080/operate   (demo / demo)
# Tasklist: http://localhost:8080/tasklist
#
# Do not run this at the same time as the root docker-compose.yml (both use port 8080).

services:
  camunda-data-init:
    image: camunda/camunda:8.10.9
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:8.10.9
    ports:
      - "8080:8080"
      - "26500:26500"
      - "9600:9600"
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./application.yaml:/usr/local/camunda/config/application.yaml:ro
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:
