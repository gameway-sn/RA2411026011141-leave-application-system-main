# Leave Application System - complete stack
#
#   docker compose up -d --build
#
#   Frontend (React + Nginx) ...... http://localhost:3000
#   Backend  (Spring Boot) ........ http://localhost:8081
#   Camunda Operate / Tasklist .... http://localhost:8080/operate  (login demo / demo)
#   PostgreSQL .................... localhost:5432 (leave / leave)
#
# For local development only - not a production setup.

services:

  # Gives the Camunda container permission to write to its data volume
  camunda-data-init:
    image: camunda/camunda:8.10.9
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  # Camunda 8 Orchestration Cluster: Zeebe engine + Operate + Tasklist in one container
  orchestration:
    image: camunda/camunda:8.10.9
    ports:
      - "8080:8080"     # REST API + Operate + Tasklist
      - "26500:26500"   # gRPC (job workers, commands)
      - "9600:9600"     # management / health
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  # Application database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Spring Boot: REST API, job workers, deploys the BPMN + form on startup
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      CAMUNDA_GRPC_ADDRESS: http://orchestration:26500
      CAMUNDA_REST_ADDRESS: http://orchestration:8080
      DB_URL: jdbc:postgresql://postgres:5432/leavedb
      DB_USERNAME: leave
      DB_PASSWORD: leave
      H2_CONSOLE_ENABLED: "false"
    # Camunda can report healthy a few seconds before it accepts deployments;
    # if the first start fails, Docker simply starts the backend again.
    restart: on-failure
    depends_on:
      orchestration:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # React app served by Nginx; /api is proxied to the backend
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: on-failure
    depends_on:
      - backend

volumes:
  camunda:
  camunda-data:
  postgres-data:
